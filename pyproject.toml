[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
non_interactive = true
follow_imports = "silent"
files = [
	"main.py",
	"Source"
]
exclude = [
	"Source/CLI/Legacy",
	"Source/Core/Base",
	"Source/Utils/Development.py",
	"__pycache__"
]

[tool.ruff]
include = [
	"main.py",
	"Source"
]
exclude = [
	"Source/CLI/Legacy",
	"Source/Core/Base",
	"Source/Utils/Development.py",
	"__pycache__"
]

[tool.ruff.lint]
ignore = ["E701"]