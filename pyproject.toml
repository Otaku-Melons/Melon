[project]
name = "melon"
version = "1.0.0-rc.4"
description = "Modular parsera management system."
readme = "README.md"
authors = [
    { name = "DUB1401", email = "vlad.milosta@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
	"beautifulsoup4",
	"dublib @ git+https://github.com/DUB1401/dublib",
	"dulwich>=1.2.6",
	"EbookLib",
	"img2pdf",
	"pillow",
	"python-dotenv"
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[project.scripts]
melon = "melon:main"

[build-system]
requires = ["uv-build>=0.12.2,<0.13.0", "uv-dynamic-versioning"]
build-backend = "uv_build"

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
non_interactive = true
follow_imports = "silent"
files = ["src"]

[tool.ruff.lint]
select = ["C", "E", "I", "S"]
ignore = ["C901", "E701", "E501"]

[tool.ruff.lint.isort]
lines-after-imports = 1
sections = {"dublib" = ["dublib"]}
section-order = [
	"future",
	"standard-library",
	"third-party",
	"dublib",
	"first-party",
	"local-folder"
]