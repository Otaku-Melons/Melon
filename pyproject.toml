[project]
name = "Melon"
dynamic = ["version"]
dependencies = [
	"beautifulsoup4",
	"dublib==0.29.0",
	"dulwich>=1.2.6",
	"EbookLib",
	"img2pdf",
	"pillow",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[tool.setuptools.packages.find]
include = ["Source*"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
non_interactive = true
follow_imports = "silent"
files = ["main.py", "Source"]
exclude = ["__pycache__"]

[tool.ruff.lint]
select = ["C", "E", "I", "S"]
ignore = ["C901", "E701", "E501"]

[tool.ruff.lint.isort]
lines-after-imports = 1
sections = {"dublib" = ["dublib"]}
section-order = [
	"future",
	"standard-library",
	"third-party",
	"dublib",
	"first-party",
	"local-folder"
]